name = "vaquita-codigo"
main = "worker/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./public/"
binding = "ASSETS"
run_worker_first = ["/api/*", "/j/*", "/ejemplo"]

# Sin identificador: Cloudflare crea la base sola en la primera publicación
[[d1_databases]]
binding = "DB"

# Limpia una vez por día lo que lleva más de 30 días borrado
[triggers]
crons = ["17 7 * * *"]
